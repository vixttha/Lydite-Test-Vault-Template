name: Lydite validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lydite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory-and-adoption:
    name: Inventory and starter adoption
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.5'
          cache: false
      - name: Verify inventory and adoption
        shell: bash
        run: |
          set -o pipefail
          {
            printf 'Checkout: %s\n\n' "$(git rev-parse HEAD)"
            python tools/inventory.py
          } | tee -a "$GITHUB_STEP_SUMMARY"
          python -m unittest discover -s tools -p 'test_inventory.py' -v
          python tools/verify_adoption.py --fixture python-cli
          python tools/verify_adoption.py --fixture go-api
          python tools/verify_adoption.py --fixture docs-only
          python tools/verify_evidence_adoption.py

  examples:
    name: Language examples (${{ matrix.runner }})
    if: github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: runner.os == 'Linux'
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        if: runner.os == 'Linux'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Lua and report hosted toolchains
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.4
          bash --version
          dotnet --version
          g++ --version
          ghc --version
          go version
          java -version
          lua5.4 -v
          node --version
          python --version
          ruby --version
          rustc --version
      - name: Run language examples
        shell: bash
        env:
          LYDITE_RUNNER: ${{ matrix.runner }}
        run: |
          set -o pipefail
          python tools/inventory.py --runner "$LYDITE_RUNNER" \
             --evidence "$RUNNER_TEMP/lydite-cases/examples.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload per-case evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lydite-cases-${{ matrix.runner }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lydite-cases/
          if-no-files-found: error
          retention-days: 7
